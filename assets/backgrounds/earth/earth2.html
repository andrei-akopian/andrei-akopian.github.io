<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Background Tester 2</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="description" content="Description Goes Here" />
        <script src="./earth/earth.js"></script>
    </head>
    <body>
        <h1>Background</h1>
        <div class="background-wrapper">
            <div class="stars-mask">
                <div class="stars"></div>
            </div>
            <!-- This section is developed in assets/backgrounds and pasted over. do not edit. -->
            <link rel="stylesheet" type="text/css" href="./earth/earth2.css" />
            <div class="earth-map">
                <div class="continents_slide1">
                    <div class="russia"></div>
                    <div class="asia"></div>
                    <div class="south-asia"></div>
                    <div class="australia"></div>
                </div>
                <div class="continents_slide2">
                    <div class="europe"></div>
                    <div class="scandinavia"></div>
                    <div class="middle-east"></div>
                    <div class="south-africa"></div>
                    <div class="sahara"></div>
                </div>
                <div class="continents_slide3">
                    <div class="united-states"></div>
                    <div class="canada"></div>
                    <div class="far-south-america"></div>
                    <div class="amazon"></div>
                </div>
                <div class="clouds">
                    <div class="linear-clouds1"></div>
                    <div class="radial-clouds1"></div>
                    <div class="linear-clouds3"></div>
                </div>
            </div>
            <div class="moon">
            </div>
        </div>
        <button onclick="triggerBackground()">Background</button>
    </body>
</html>
